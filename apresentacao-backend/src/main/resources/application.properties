spring.application.name=recifecultural

# Server (Render injeta $PORT dinamicamente; 8080 é o default local/Docker)
server.port=${PORT:8080}

# Datasource (override via SPRING_DATASOURCE_* in Docker or local env)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/recifecultural}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:recifecultural}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:recifecultural}

# JPA — DDL auto
# DANGER: the default below is intentionally permissive for local dev only.
# In production (Render) this MUST be overridden via the env var:
#   SPRING_JPA_HIBERNATE_DDL_AUTO=validate
# Using "update" in production lets Hibernate silently mutate the live schema
# on every boot, which can cause irreversible data loss. The render.yaml already
# sets this env var to "validate"; never change it back to "update" there.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# Fixtures locais — JPA cria as tabelas primeiro, depois o data.sql roda
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Schedulers
recifecultural.scheduler.prereserva.intervalo-ms=60000
recifecultural.scheduler.chamado.intervalo-ms=3600000
recifecultural.scheduler.chamado.sla-horas=24

# Swagger / SpringDoc
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.api-docs.path=/v3/api-docs

# Actuator — Render usa /actuator/health para healthcheck
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
