spring.application.name=recifecultural

# Server (Render injeta $PORT dinamicamente; 8080 é o default local/Docker)
server.port=${PORT:8080}

# Datasource (override via SPRING_DATASOURCE_* in Docker or local env)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/recifecultural}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:recifecultural}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:recifecultural}

# JPA (dev-friendly default; use validate/none in production with migrations)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# Fixtures locais — JPA cria as tabelas primeiro, depois o data.sql roda
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Schedulers
recifecultural.scheduler.prereserva.intervalo-ms=60000
recifecultural.scheduler.chamado.intervalo-ms=3600000
recifecultural.scheduler.chamado.sla-horas=24

# Swagger / SpringDoc
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.api-docs.path=/v3/api-docs

# Actuator — Render usa /actuator/health para healthcheck
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
